name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build native release
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked --target "$TARGET"
          mkdir -p bin
          cp "target/$TARGET/release/rex-extract" bin/
          cp "target/$TARGET/release/rex-collect" bin/
      - name: Test built helpers
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_equivalence.py
      - name: Package release and dependency licenses
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/package.py --target "$TARGET" --binary-dir "target/$TARGET/release"
      - name: Verify installation from the archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/install.py --archive target/dist/rex-extrakto-*"$TARGET".tar.gz --install-dir "$RUNNER_TEMP/rex-extrakto" --no-config
          "$RUNNER_TEMP/rex-extrakto/current/bin/rex-collect" --version
          "$RUNNER_TEMP/rex-extrakto/current/bin/rex-extract" --version
          "$RUNNER_TEMP/rex-extrakto/current/deps/fzf" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/dist
          merge-multiple: true
      - name: Publish verified assets
        run: |
          python3 scripts/package.py --checksums-only --verify-version "$TAG"
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "docs/releases/$TAG.md" target/dist/*.tar.gz target/dist/SHA256SUMS
          gh release edit "$TAG" --draft=false --latest
